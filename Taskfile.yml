# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: [".env"]

# Named docsite so the public docs:* tasks do not clash with the include.
includes:
  docsite:
    taskfile: ./docs/Taskfile.yml
    dir: ./docs
    internal: true

tasks:
  list:
    desc: List available tasks
    aliases: [default]
    silent: true
    cmds:
      - task --list

  test:
    desc: Run the tests
    cmds:
      - uv run pytest

  docs:
    desc: Serve the documentation site
    cmds:
      - task: docsite:serve

  docs:build:
    desc: Build the documentation site
    cmds:
      - task: docsite:build

  docs:release:
    desc: Build the site and publish it to gh-pages
    cmds:
      - task: docsite:release

  ci:
    desc: Run tests and build the documentation
    cmds:
      - task: test
      - task: docs:build
