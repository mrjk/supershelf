name: ci

on:
  push:
    branches:
      - main
      - dev
      - "dev-*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run ci
        run: mise x -- task ci

  deploy:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: docs:release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Publish documentation
        run: mise x -- task docs:release
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
