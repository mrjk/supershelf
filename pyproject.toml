[project]
name = "supershelf"
version = "0.1.0"
description = "Supershelf profile configuration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mrjk.clak[colors,config]",
    "pydantic",
]

[project.scripts]
supershelf = "supershelf:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
