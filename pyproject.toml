[project]
name = "supershelf"
version = "0.1.0"
description = "Supershelf profile configuration"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.13"
dependencies = [
    "jinja2",
    "mrjk.clak[colors,config]",
    "pydantic",
    "pypdf",
]

[project.scripts]
supershelf = "supershelf:main"

[dependency-groups]
dev = ["pytest"]
docs = [
    "zensical>=0.0.63",
    "ghp-import>=2.1.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supershelf = ["default.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]
