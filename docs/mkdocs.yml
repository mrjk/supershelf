# Zensical site. From the repo root: task docs
# From docs/: task serve

site_name: Supershelf
site_description: Profile files, file matching, and variables for a folder of documents

docs_dir: content
site_dir: site

theme:
  variant: modern
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.highlight
    - content.tabs.link

plugins:
  - awesome-nav

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.snippets:
      base_path:
        - ..
  - toc:
      permalink: true
